name: update-vrt-baseline

on:
  pull_request:
    types: [labeled]

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.event.label.name == 'vrt-approved'
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Check maintainer write permission
      env:
        GH_TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
      run: |
        permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
        case "$permission" in
          admin|write) ;;
          *)
            echo "::error::@$ACTOR does not have write permission. Only maintainers can approve VRT baseline updates."
            exit 1
            ;;
        esac

    - uses: actions/checkout@v6.1.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - uses: $/.github/actions/generate-vrt-snapshots

    - uses: $/.github/actions/push-vrt-baselines
      with:
        commit-message: "chore: update VRT baselines from PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }}) [skip ci]"

    - name: Remove vrt-approved label
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/vrt-approved" \
          || echo "::warning::Failed to remove the vrt-approved label"
